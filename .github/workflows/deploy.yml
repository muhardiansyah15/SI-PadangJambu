# Build portal React (Vite) lalu deploy seluruh situs ke GitHub Pages.
# Prasyarat satu kali: Settings > Pages > Source: "GitHub Actions".
name: Deploy situs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: portal/package-lock.json
      - name: Build portal
        working-directory: portal
        run: |
          npm ci
          npm run build
      - name: Susun folder situs
        run: |
          mkdir -p _site/portal
          cp index.html _site/
          cp -r assets _site/
          cp -r portal/dist/. _site/portal/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
